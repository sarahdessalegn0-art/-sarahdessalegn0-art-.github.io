<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7 - Image Transparency</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Centered table with a CSS effect (box-shadow and rounded corners) */
        table {
            margin: auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
        }

        td {
            padding: 20px;
        }

        /* Image 1: Starts at 0.4 opacity, goes to 1.0 on hover (W3Schools style) */
        img.img1 {
            opacity: 0.4;
            filter: alpha(opacity=40); /* For IE8 and earlier */
            width: 300px;
            height: auto;
            transition: opacity 0.3s ease;
        }

        img.img1:hover {
            opacity: 1.0;
            filter: alpha(opacity=100);
        }

        /* Image 2: Starts at 0.6 opacity, goes to 1.0 on hover */
        img.img2 {
            opacity: 0.6;
            filter: alpha(opacity=60); /* For IE8 and earlier */
            width: 300px;
            height: auto;
            transition: opacity 0.3s ease;
        }

        img.img2:hover {
            opacity: 1.0;
            filter: alpha(opacity=100);
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>
                <!-- Replace 'img1.jpg' with your first image file -->
                <img src="img1.jpg" alt="Image 1" class="img1">
            </td>
        </tr>
        <tr>
            <td>
                <!-- Replace 'img2.jpg' with your second image file -->
                <img src="img2.jpg" alt="Image 2" class="img2">
            </td>
        </tr>
    </table>

</body>
</html>
