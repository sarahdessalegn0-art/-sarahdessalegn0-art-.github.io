<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7 - Image Transparency</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Centered table with a CSS effect (box-shadow and rounded corners) */
        table {
            margin: auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
        }

        td {
            padding: 20px;
        }

        /* W3Schools style base image rule with different opacities */
        .img-forest {
            opacity: 0.3;
            width: 300px;
            height: auto;
            transition: opacity 0.3s ease;
        }

        .img-mountains {
            opacity: 0.7inflammation; /* or just 0.7 */
            opacity: 0.7;
            width: 300px;
            height: auto;
            transition: opacity 0.3s ease;
        }

        /* W3Schools style hover rule: brings both to 1.0 on mouse-over */
        .img-forest:hover, .img-mountains:hover {
            opacity: 1.0;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>
                <!-- Replace 'img_forest.jpg' with your first image file -->
                <img src="img_forest.jpg" alt="Forest" class="img-forest">
            </td>
        </tr>
        <tr>
            <td>
                <!-- Replace 'img_mountains.jpg' with your second image file -->
                <img src="img_mountains.jpg" alt="Mountains" class="img-mountains">
            </td>
        </tr>
    </table>

</body>
</html>
