<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-Level CSS Navigation with Sprites & Responsive Layout</title>
  <style>
    /* ========== BASE RESETS & STYLES ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e0e0e0;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ========== HEADER & 2-LEVEL HORIZONTAL NAVIGATION ========== */
    header {
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Level 1 Horizontal Bar */
    .nav-main {
      list-style: none;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .nav-main > li {
      position: relative;
    }

    .nav-main > li > a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.25rem;
      text-decoration: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      transition: background 0.25s ease;
    }

    .nav-main > li > a:hover,
    .nav-main > li:hover > a,
    .nav-main > li > a:focus {
      background: rgba(255, 255, 255, 0.15);
    }

    /* CSS SVG Sprite Base Class */
    .icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Submenu Arrow Indicator */
    .has-sub > a::after {
      content: "▾";
      font-size: 0.75em;
      margin-left: 0.2rem;
      opacity: 0.8;
    }

    /* Level 2 Dropdown Menu */
    .nav-sub {
      list-style: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 200px;
      background: rgba(20, 25, 45, 0.98);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      padding: 0.5rem 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
      z-index: 100;
    }

    .nav-main > li:hover > .nav-sub,
    .nav-main > li:focus-within > .nav-sub {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .nav-sub li a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.2rem;
      color: #e0e0e0;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-sub li a:hover,
    .nav-sub li a:focus {
      background: rgba(79, 195, 247, 0.2);
      color: #4fc3f7;
    }

    /* ========== MAIN CONTENT & GALLERY ========== */
    main {
      max-width: 960px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }
