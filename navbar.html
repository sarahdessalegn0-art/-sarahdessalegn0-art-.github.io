<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Navigation Bar Challenge</title>
    <style>
        /* 1. Style the navbar */
        .navbar {
          background-color: dimgray;
          overflow: hidden;
        }

        /* 2 & 3. Style the links and text decoration */
        .navbar a {
          float: left;
          color: white;
          padding: 14px 16px;
          text-decoration: none;
        }

        /* 4. Style hover state */
        .navbar a:hover {
          background-color: #04AA6D;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar Structure -->
    <div class="navbar">
      <a href="#home">Home</a>
      <a href="#news">News</a>
      <a href="#contact">Contact</a>
      <a href="#about">About</a>
    </div>

</body>
</html>
